<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="#f8fafc"/>
  <!-- Laptop Screen Lid -->
  <rect x="110" y="50" width="380" height="230" rx="14" fill="#0f172a" stroke="#334155" stroke-width="4"/>
  <!-- Display Screen -->
  <rect x="125" y="65" width="350" height="200" rx="6" fill="url(#screenGrad)"/>
  <!-- Screen Graphic & Logo -->
  <circle cx="300" cy="145" r="32" fill="url(#accentGrad)" opacity="0.9"/>
  <text x="300" y="152" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">&#128187;</text>
  <text x="300" y="210" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="14" font-weight="600" fill="#e0e7ff" text-anchor="middle">HIGH PERFORMANCE LAPTOP</text>
  <text x="300" y="232" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="11" fill="#94a3b8" text-anchor="middle">Official Manufacturer Catalog</text>
  <!-- Laptop Hinge & Base -->
  <path d="M 70 280 L 530 280 L 550 310 L 50 310 Z" fill="url(#bodyGrad)" stroke="#64748b" stroke-width="2"/>
  <!-- Trackpad -->
  <rect x="250" y="288" width="100" height="16" rx="4" fill="#cbd5e1" stroke="#94a3b8" stroke-width="1"/>
  <!-- Rubber Foot / Base Shadow -->
  <ellipse cx="300" cy="325" rx="260" ry="12" fill="#000000" opacity="0.08"/>
</svg>
